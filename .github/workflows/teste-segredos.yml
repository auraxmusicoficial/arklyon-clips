name: Teste dos segredos
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/teste-segredos.yml"]
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir chaves e avisar no celular
        env:
          VAULT_SECRETS: ${{ secrets.VAULT_SECRETS }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          s = json.loads(os.environ["VAULT_SECRETS"])
          res = []
          # YouTube
          try:
              d = urllib.parse.urlencode({"client_id": s["YT_CLIENT_ID"], "client_secret": s["YT_CLIENT_SECRET"],
                                          "refresh_token": s["YT_REFRESH_TOKEN"], "grant_type": "refresh_token"}).encode()
              json.load(urllib.request.urlopen("https://oauth2.googleapis.com/token", d))["access_token"]; res.append("YouTube ✅")
          except Exception as e: res.append(f"YouTube ❌ {e}")
          # Groq
          try:
              r = urllib.request.Request("https://api.groq.com/openai/v1/models", headers={"Authorization": "Bearer " + s["GROQ_KEY"], "User-Agent": "vault"})
              urllib.request.urlopen(r).read(); res.append("IA grátis ✅")
          except Exception as e: res.append(f"IA grátis ❌ {e}")
          # Buffer
          try:
              q = json.dumps({"query": "{ account { id } }"}).encode()
              r = urllib.request.Request("https://api.buffer.com", q, {"Authorization": "Bearer " + s["BUFFER_KEY"], "Content-Type": "application/json", "User-Agent": "vault"})
              out = json.load(urllib.request.urlopen(r)); res.append("Buffer ✅" if "errors" not in out else f"Buffer ⚠️ {out['errors'][0].get('message')}")
          except Exception as e: res.append(f"Buffer ❌ {e}")
          msg = "Robô do GitHub funcionando!\n" + " · ".join(res)
          print(msg)
          urllib.request.urlopen(urllib.request.Request("https://ntfy.sh/" + s["NTFY_TOPIC"], msg.encode(), {"Title": "HQ Vault Clips"}))
          PY
