name: Gerar imagem (IA grátis)
on:
  workflow_dispatch:
    inputs:
      prompt: {description: "prompt", required: true}
      nome: {description: "nome do arquivo (sem extensão)", required: true}
      seeds: {description: "sementes separadas por vírgula", required: false, default: "1,2,3"}
      largura: {required: false, default: "1024"}
      altura: {required: false, default: "1024"}
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Gerar
        env:
          PROMPT: ${{ inputs.prompt }}
          NOME: ${{ inputs.nome }}
          SEEDS: ${{ inputs.seeds }}
          W: ${{ inputs.largura }}
          H: ${{ inputs.altura }}
        run: |
          mkdir -p amostras/ia
          python3 - <<'PY'
          import os, urllib.parse, urllib.request, time
          p = urllib.parse.quote(os.environ["PROMPT"])
          for s in os.environ["SEEDS"].split(","):
              url = f"https://image.pollinations.ai/prompt/{p}?width={os.environ['W']}&height={os.environ['H']}&seed={s.strip()}&nologo=true&model=flux"
              for t in range(3):
                  try:
                      d = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "vault"}), timeout=180).read()
                      if len(d) > 10000:
                          open(f"amostras/ia/{os.environ['NOME']}_{s.strip()}.jpg", "wb").write(d); print("ok", s, len(d)); break
                  except Exception as e:
                      print("tentativa", t, e); time.sleep(10)
          PY
      - run: |
          git config user.name "Vault Robot (GitHub)"; git config user.email actions@github.com
          git add amostras/ia && git commit -m "imagens IA: ${{ inputs.nome }}" && git pull --rebase -q && git push -q || echo "nada gerado"
