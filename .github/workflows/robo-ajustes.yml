name: Robô — YouTube, comentários e divulgação
on:
  schedule:
    - cron: "10,40 0-2,9-23 * * *"   # a cada 30 min, das 6h10 às 23h40 (Brasília) — o GitHub às vezes pula rodadas
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: robo-ajustes
  cancel-in-progress: false
jobs:
  ajustes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Segredos
        env:
          VAULT_SECRETS: ${{ secrets.VAULT_SECRETS }}
        run: |
          python3 -c "import json,os;[print('::add-mask::'+v) for v in json.loads(os.environ['VAULT_SECRETS']).values()]"
      - run: pip install -q pillow
      - name: Rodar o robô
        env:
          VAULT_SECRETS: ${{ secrets.VAULT_SECRETS }}
        run: python3 motor/robo_github.py
